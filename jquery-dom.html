<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q3: Compare Native JavaScript and jQuery</title>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.5;
    }
    #myElement, #myDIV {
      margin-bottom: 12px;
    }
    .myStyle {
      background-color: coral;
      padding: 16px;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Question 3: jQuery DOM Manipulation and Events</h2>

  <div id="myElement">Original Text</div>
  <div id="myDIV"><p>I am a myDIV.</p></div>
  <button id="myButton">Click me</button>

  <script>
    // (a) document.getElementById("myElement").textContent = "Modified Text";
    $("#myElement").text("Modified Text");

    // (b) document.querySelector("#myDIV").classList.add("myStyle");
    $("#myDIV").addClass("myStyle");

    // (c) document.getElementById("myButton").addEventListener("click", () => alert("Button clicked!"));
    $("#myButton").on("click", function () {
      alert("Button clicked!");
    });
  </script>
</body>
</html>
